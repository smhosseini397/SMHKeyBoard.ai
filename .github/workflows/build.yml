name: Build KeyFarsi Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KeyFarsi APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK Packages
        run: |
          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Verify bundled learning resources
        run: |
          test -s KeyFarsi-Learning/learning_profile_template.json
          test -s KeyFarsi-Learning/learning_profile.schema.json
          test -s KeyFarsi-Learning/seed_corrections.json
          test -s app/src/main/assets/learning/learning_profile_template.json
          test -s app/src/main/assets/learning/learning_profile.schema.json
          test -s app/src/main/assets/learning/seed_corrections.json
          cmp KeyFarsi-Learning/learning_profile_template.json app/src/main/assets/learning/learning_profile_template.json
          cmp KeyFarsi-Learning/learning_profile.schema.json app/src/main/assets/learning/learning_profile.schema.json
          cmp KeyFarsi-Learning/seed_corrections.json app/src/main/assets/learning/seed_corrections.json

      - name: Build Debug APK
        run: gradle --no-daemon assembleDebug

      - name: Verify APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: KeyFarsi-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
